<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Music App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #121212; color: #eee;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 16px 24px; border-bottom: 1px solid #333; }
  header h1 { font-size: 20px; }
  header input {
    margin-top: 8px; width: 100%; padding: 10px;
    border-radius: 8px; border: none; background: #1e1e1e; color: #eee;
  }
  main { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .track {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; border-radius: 8px; cursor: pointer;
  }
  .track:hover { background: #1e1e1e; }
  .track.active { background: #2a2a4a; }
  .track-info { display: flex; flex-direction: column; }
  .track-title { font-weight: 600; }
  .track-meta { font-size: 12px; color: #999; }
  footer {
    background: #181818; border-top: 1px solid #333;
    padding: 16px 24px;
  }
  .player { display: flex; align-items: center; gap: 16px; }
  .player-info { flex: 1; }
  .player-title { font-weight: 600; }
  .player-artist { font-size: 12px; color: #999; }
  audio { width: 100%; }
  .upload {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .upload input[type=file] { flex: 1; }
  .upload button, .upload label {
    padding: 8px 14px; background: #1db954; color: #000;
    border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
  }
</style>
</head>
<body>
  <header>
    <h1>🎵 Music App</h1>
    <input id="search" placeholder="Поиск по названию или исполнителю...">
  </header>

  <main>
    <div class="upload">
      <input type="file" id="fileInput" accept="audio/*" multiple>
      <button onclick="upload()">Загрузить</button>
    </div>
    <div id="list"></div>
  </main>

  <footer>
    <div class="player">
      <div class="player-info">
        <div class="player-title" id="nowTitle">Ничего не играет</div>
        <div class="player-artist" id="nowArtist"></div>
      </div>
    </div>
    <audio id="audio" controls style="margin-top: 12px;"></audio>
  </footer>

<script>
const API = "";
let currentTrackId = null;
const audio = document.getElementById("audio");

async function loadTracks(q = "") {
  const url = q ? `${API}/tracks?q=${encodeURIComponent(q)}` : `${API}/tracks`;
  const res = await fetch(url);
  const tracks = await res.json();
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!tracks.length) {
    list.innerHTML = "<p style='color:#888'>Пусто. Загрузите треки ↑</p>";
    return;
  }
  tracks.forEach(t => {
    const el = document.createElement("div");
    el.className = "track" + (t.id === currentTrackId ? " active" : "");
    el.innerHTML = `
      <div class="track-info">
        <span class="track-title">${t.title}</span>
        <span class="track-meta">${t.artist}${t.album ? " — " + t.album : ""} · ${formatTime(t.duration)}</span>
      </div>
      <span>▶</span>
    `;
    el.onclick = () => playTrack(t);
    list.appendChild(el);
  });
}

function playTrack(track) {
  currentTrackId = track.id;
  audio.src = `${API}/tracks/${track.id}/stream`;
  audio.play();
  document.getElementById("nowTitle").textContent = track.title;
  document.getElementById("nowArtist").textContent = track.artist;
  loadTracks(document.getElementById("search").value);
  fetch(`${API}/users/1/play/${track.id}`, { method: "POST" }).catch(() => {});
}

async function upload() {
  const files = document.getElementById("fileInput").files;
  if (!files.length) return alert("Выберите файлы");
  for (const file of files) {
    const fd = new FormData();
    fd.append("file", file);
    await fetch(`${API}/tracks/upload`, { method: "POST", body: fd });
  }
  document.getElementById("fileInput").value = "";
  loadTracks();
}

function formatTime(s) {
  s = Math.floor(s || 0);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}

let searchTimer;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadTracks(e.target.value), 300);
});

audio.addEventListener("ended", () => {
  const tracks = document.querySelectorAll(".track");
  const idx = [...tracks].findIndex(el => el.classList.contains("active"));
  if (idx >= 0 && idx + 1 < tracks.length) tracks[idx + 1].click();
});

loadTracks();
</script>
</body>
</html>
